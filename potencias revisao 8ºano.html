<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ficha de Revisão: Regras das Potências</title>
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #bbf7d0;
      --incorrect: #dc2626;
      --incorrect-bg: #fef2f2;
      --incorrect-border: #fecaca;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 28px;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 4px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-tracker {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 20px 0 16px 0;
      color: var(--text);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.selected-incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect);
      color: #7f1d1d;
      font-weight: 600;
    }

    .option-btn.show-correct {
      border-color: var(--correct);
      background-color: var(--correct-bg);
    }

    .rationale-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .rationale-box.correct {
      background-color: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: #14532d;
    }

    .rationale-box.incorrect {
      background-color: var(--incorrect-bg);
      border: 1px solid var(--incorrect-border);
      color: #7f1d1d;
    }

    .footer-actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-next {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: none;
    }

    .btn-next:hover {
      background-color: var(--primary-hover);
    }

    /* Final Screen Styles */
    .results-screen {
      display: none;
      text-align: center;
      padding: 12px 0;
    }

    .results-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .score-summary {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 24px 0;
    }

    .score-card {
      flex: 1;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .score-card.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .score-card.incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect-border);
    }

    .score-number {
      font-size: 2.2rem;
      font-weight: 800;
    }

    .score-card.correct .score-number {
      color: var(--correct);
    }

    .score-card.incorrect .score-number {
      color: var(--incorrect);
    }

    .score-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .final-message {
      font-size: 1.1rem;
      margin-bottom: 28px;
      color: var(--text);
    }

    .btn-restart {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-restart:hover {
      background-color: var(--primary-hover);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header id="quiz-header">
      <h1>Ficha de Revisão: Regras das Potências</h1>
      <p class="subtitle">Preparação para o 8.º ano (Base e expoente natural)</p>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="question-tracker" id="question-tracker">Pergunta 1 de 15</div>
    </header>

    <!-- Quiz Content Screen -->
    <main id="quiz-screen">
      <div class="question-title" id="question-text">A carregar pergunta...</div>
      
      <div class="options" id="options-container">
        <!-- Dynamic Options -->
      </div>

      <div class="rationale-box" id="rationale-box"></div>

      <div class="footer-actions">
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">Seguinte &rarr;</button>
      </div>
    </main>

    <!-- Final Results Screen -->
    <div class="results-screen" id="results-screen">
      <div class="results-title">Ficha Concluída!</div>
      <p class="final-message" id="final-message">Aqui está o resumo do teu desempenho:</p>
      
      <div class="score-summary">
        <div class="score-card correct">
          <div class="score-number" id="correct-count">0</div>
          <div class="score-label">Respostas Certas</div>
        </div>
        <div class="score-card incorrect">
          <div class="score-number" id="incorrect-count">0</div>
          <div class="score-label">Respostas Erradas</div>
        </div>
      </div>

      <button class="btn-restart" id="btn-restart" onclick="restartQuiz()">Tentar Novamente</button>
    </div>
  </div>

  <script>
    const questionsData = [
      {
        question: "Escreve a expressão $4^3 \\times 4^5$ na forma de uma única potência.",
        options: [
          { text: "$4^8$", isCorrect: true, rationale: "Na multiplicação de potências com a mesma base, mantém-se a base e somam-se os expoentes ($3 + 5 = 8$)." },
          { text: "$4^{15}$", isCorrect: false, rationale: "Aqui multiplicaste os expoentes em vez de os somar. Lembre-se: bases iguais, somam-se os expoentes." },
          { text: "$16^8$", isCorrect: false, rationale: "Multiplicaste as bases e somaste os expoentes. Ao manter a base, o valor $4$ não se altera." },
          { text: "$16^{15}$", isCorrect: false, rationale: "Multiplicaste as bases e os expoentes. A regra exige manter a base e somar os expoentes." }
        ]
      },
      {
        question: "Simplifica sob a forma de uma única potência a divisão $12^7 \\div 3^7$.",
        options: [
          { text: "$4^7$", isCorrect: true, rationale: "Na divisão de potências com o mesmo expoente, dividem-se as bases ($12 \\div 3 = 4$) e mantém-se o expoente." },
          { text: "$4^0$", isCorrect: false, rationale: "Subtraíste os expoentes sem necessidade. Como os expoentes já são iguais, mantém-se o expoente $7$." },
          { text: "$9^7$", isCorrect: false, rationale: "Subtraíste as bases ($12 - 3$) em vez de as dividir ($12 \\div 3 = 4$)." },
          { text: "$12^1$", isCorrect: false, rationale: "Dividiste o expoente pela base em vez de aplicar a regra de potências de mesmo expoente." }
        ]
      },
      {
        question: "Escreve o resultado de $8^{11} \\div 8^4$ sob a forma de uma única potência.",
        options: [
          { text: "$8^7$", isCorrect: true, rationale: "Na divisão de potências com a mesma base, mantém-se a base e subtraem-se os expoentes ($11 - 4 = 7$)." },
          { text: "$8^{15}$", isCorrect: false, rationale: "Somaste os expoentes em vez de os subtrair. A soma aplica-se à multiplicação, não à divisão." },
          { text: "$1^7$", isCorrect: false, rationale: "Dividiste as bases ($8 \\div 8 = 1$). Quando as bases são iguais, basta mantê-la." },
          { text: "$8^{44}$", isCorrect: false, rationale: "Multiplicaste os expoentes em vez de subtrair." }
        ]
      },
      {
        question: "Reduz a uma única potência o produto $3^4 \\times 5^4$.",
        options: [
          { text: "$15^4$", isCorrect: true, rationale: "Na multiplicação de potências com o mesmo expoente, multiplicam-se as bases ($3 \\times 5 = 15$) e mantém-se o expoente." },
          { text: "$15^8$", isCorrect: false, rationale: "Multiplicaste as bases e somaste os expoentes. Quando os expoentes são iguais, mantém-se o expoente." },
          { text: "$8^4$", isCorrect: false, rationale: "Somaste as bases ($3 + 5$) em vez de as multiplicar." },
          { text: "$15^{16}$", isCorrect: false, rationale: "Multiplicaste as bases e multiplicaste os expoentes." }
        ]
      },
      {
        question: "Qual é o valor numérico de $(7^0 + 1^{15}) \\times 5^1$?",
        options: [
          { text: "$10$", isCorrect: true, rationale: "Como $7^0 = 1$, $1^{15} = 1$ e $5^1 = 5$, a expressão fica $(1 + 1) \\times 5 = 2 \\times 5 = 10$." },
          { text: "$5$", isCorrect: false, rationale: "Esqueceste-te de que $7^0 = 1$ e usaste $7^0 = 0$ ($0 + 1 = 1$; $1 \\times 5 = 5$)." },
          { text: "$40$", isCorrect: false, rationale: "Consideraste $7^0 = 7$ em vez de $1$." },
          { text: "$0$", isCorrect: false, rationale: "Assumiste que a presença do expoente $0$ torna todo o resultado zero." }
        ]
      },
      {
        question: "Simplifica a expressão com duas operações: $(6^2 \\times 6^5) \\div 6^4$.",
        options: [
          { text: "$6^3$", isCorrect: true, rationale: "Primeiro resolve o parêntesis: $6^2 \\times 6^5 = 6^7$. Depois, divide por $6^4$: $6^7 \\div 6^4 = 6^{7-4} = 6^3$." },
          { text: "$6^6$", isCorrect: false, rationale: "Cometeste um erro de cálculo nas operações com os expoentes." },
          { text: "$6^{10}$", isCorrect: false, rationale: "Multiplicaste os expoentes do parêntesis em vez de os somar." },
          { text: "$1^3$", isCorrect: false, rationale: "Dividiste as bases no passo final em vez de manter a base $6$." }
        ]
      },
      {
        question: "Qual das seguintes expressões é equivalente ao valor numérico $100\\,000$?",
        options: [
          { text: "$10^5$", isCorrect: true, rationale: "Uma potência de base $10$ é igual a $1$ seguido de tantos zeros quanto o expoente ($5$ zeros = $10^5$)." },
          { text: "$10^6$", isCorrect: false, rationale: "O número $100\\,000$ tem $5$ zeros, não $6$ zeros ($10^6 = 1\\,000\\,000$)." },
          { text: "$10^4$", isCorrect: false, rationale: "O número $100\\,000$ tem $5$ zeros, não $4$ zeros ($10^4 = 10\\,000$)." },
          { text: "$5^{10}$", isCorrect: false, rationale: "Trocas-te a base pelo expoente." }
        ]
      },
      {
        question: "Escreve a expressão $\\frac{20^6 \\div 5^6}{2^4 \\times 2^2}$ na forma de uma única potência.",
        options: [
          { text: "$4^0$", isCorrect: true, rationale: "Numerador: $20^6 \\div 5^6 = 4^6$. Denominador: $2^4 \\times 2^2 = 2^6 = (2^2)^3 = 4^3$ ou simplesmente no fim: $4^6 \\div 4^6 = 4^0$ (ou $1$)." },
          { text: "$4^6$", isCorrect: false, rationale: "Calculaste apenas o numerador sem efetuar a divisão pelo denominador." },
          { text: "$2^2$", isCorrect: false, rationale: "Aconteceu um erro na simplificação entre o numerador $4^6$ e o denominador $2^6$." },
          { text: "$4^{12}$", isCorrect: false, rationale: "Somaste os expoentes do numerador e do denominador em vez de subtrair na divisão." }
        ]
      },
      {
        question: "Qual das seguintes afirmações sobre potências é VERDADEIRA?",
        options: [
          { text: "$2^4 \\times 3^4 = 6^4$", isCorrect: true, rationale: "Multiplicação de potências com o mesmo expoente: multiplica-se a base ($2 \\times 3 = 6$) e mantém-se o expoente ($4$)." },
          { text: "$2^3 + 2^2 = 2^5$", isCorrect: false, rationale: "Erro clássico! Não existem regras para a ADIÇÃO de potências com a mesma base." },
          { text: "$5^2 = 10$", isCorrect: false, rationale: "$5^2$ significa $5 \\times 5 = 25$, e não a multiplicação da base pelo expoente ($5 \\times 2$)." },
          { text: "$3^0 = 0$", isCorrect: false, rationale: "Qualquer número não nulo elevado a zero é sempre igual a $1$ ($3^0 = 1$)." }
        ]
      },
      {
        question: "Determina o valor numérico da expressão $2^3 + 3^2 - 0^8$.",
        options: [
          { text: "$17$", isCorrect: true, rationale: "Calcula cada potência: $2^3 = 8$, $3^2 = 9$ e $0^8 = 0$. Substituindo: $8 + 9 - 0 = 17$." },
          { text: "$16$", isCorrect: false, rationale: "Consideraste erradamente que $0^8 = 1$." },
          { text: "$12$", isCorrect: false, rationale: "Multiplicaste as bases pelos expoentes: $2\\times 3 = 6$, $3\\times 2 = 6$, obtendo $6+6-0=12$." },
          { text: "$15$", isCorrect: false, rationale: "Fizeste um erro de cálculo na soma $8 + 9$." }
        ]
      },
      {
        question: "Qual é a representação sob a forma de uma única potência do produto $7^4 \\times 7^6$?",
        options: [
          { text: "$7^{10}$", isCorrect: true, rationale: "Bases iguais na multiplicação: conserva-se a base $7$ e somam-se os expoentes ($4 + 6 = 10$)." },
          { text: "$7^{24}$", isCorrect: false, rationale: "Multiplicaste os expoentes ($4 \\times 6 = 24$) em vez de os somar." },
          { text: "$49^{10}$", isCorrect: false, rationale: "Multiplicaste as bases ($7 \\times 7 = 49$), mas a base deve ser mantida." },
          { text: "$14^{10}$", isCorrect: false, rationale: "Somaste as bases ($7 + 7 = 14$) em vez de manter a base $7$." }
        ]
      },
      {
        question: "Como se escreve o quociente $18^5 \\div 6^5$ na forma de uma única potência?",
        options: [
          { text: "$3^5$", isCorrect: true, rationale: "Expoentes iguais na divisão: dividem-se as bases ($18 \\div 6 = 3$) e mantém-se o expoente $5$." },
          { text: "$3^0$", isCorrect: false, rationale: "Subtraíste os expoentes ($5 - 5 = 0$), mas os expoentes já eram mantidos pela regra do mesmo expoente." },
          { text: "$12^5$", isCorrect: false, rationale: "Subtraíste as bases ($18 - 6$) em vez de as dividir." },
          { text: "$3^1$", isCorrect: false, rationale: "Dividiste os expoentes ($5 \\div 5 = 1$) além de dividir as bases." }
        ]
      },
      {
        question: "Qual é o valor da expressão $(12^0 + 1^{40}) \\times 3^2$?",
        options: [
          { text: "$18$", isCorrect: true, rationale: "Primeiro resolve o parêntesis: $12^0 = 1$ e $1^{40} = 1$, logo $(1 + 1) = 2$. Depois multiplica por $3^2 = 9$: $2 \\times 9 = 18$." },
          { text: "$9$", isCorrect: false, rationale: "Consideraste $12^0 = 0$, resultando em $(0 + 1) \\times 9 = 9$." },
          { text: "$117$", isCorrect: false, rationale: "Assumiste $12^0 = 12$, obtendo $(12 + 1) \\times 9 = 117$." },
          { text: "$0$", isCorrect: false, rationale: "Multiplicaste por zero por engano." }
        ]
      },
      {
        question: "Reduz a uma única potência a expressão $(5^3 \\times 5^4) \\div 5^2$.",
        options: [
          { text: "$5^5$", isCorrect: true, rationale: "No parêntesis: $5^3 \\times 5^4 = 5^7$. De seguida: $5^7 \\div 5^2 = 5^{7-2} = 5^5$." },
          { text: "$5^{10}$", isCorrect: false, rationale: "Multiplicaste os expoentes no parêntesis ($3 \\times 4 = 12$) e subtraíste $2$." },
          { text: "$5^1$", isCorrect: false, rationale: "Dividiste os expoentes ($7 \\div 2$) em vez de subtrair." },
          { text: "$25^5$", isCorrect: false, rationale: "Alteraste a base para $25$ em vez de manter a base $5$." }
        ]
      },
      {
        question: "Qual é o valor da expressão $3^3 + 2^4 - 10^0$?",
        options: [
          { text: "$42$", isCorrect: true, rationale: "Calcula cada potência: $3^3 = 27$, $2^4 = 16$ e $10^0 = 1$. Expressão: $27 + 16 - 1 = 43 - 1 = 42$." },
          { text: "$43$", isCorrect: false, rationale: "Esqueceste-te de subtrair o $10^0 = 1$ no final." },
          { text: "$13$", isCorrect: false, rationale: "Multiplicaste as bases pelos expoentes: $3\\times3=9$, $2\\times4=8$, $10\\times0=0$ ($9+8-0=17$ ou similar)." },
          { text: "$44$", isCorrect: false, rationale: "Somaste $10^0$ em vez de subtrair." }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let correctAnswersCount = 0;
    let incorrectAnswersCount = 0;
    let answeredQuestions = new Array(questionsData.length).fill(false);

    function loadQuestion() {
      const q = questionsData[currentQuestionIndex];
      
      // Update Progress UI
      const total = questionsData.length;
      document.getElementById('question-tracker').innerText = `Pergunta ${currentQuestionIndex + 1} de ${total}`;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / total) * 100}%`;

      // Update Question Text
      document.getElementById('question-text').innerHTML = q.question;

      // Clear previous UI
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      const rationaleBox = document.getElementById('rationale-box');
      rationaleBox.style.display = 'none';
      rationaleBox.className = 'rationale-box';
      rationaleBox.innerHTML = '';

      document.getElementById('btn-next').style.display = 'none';

      // Render Options
      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${opt.text}</span>`;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });

      // Typeset MathJax
      if (window.MathJax) {
        MathJax.typesetPromise();
      }
    }

    function selectOption(selectedIndex) {
      if (answeredQuestions[currentQuestionIndex]) return; // Strictly single answer

      answeredQuestions[currentQuestionIndex] = true;
      const q = questionsData[currentQuestionIndex];
      const selectedOpt = q.options[selectedIndex];
      const optionButtons = document.querySelectorAll('.option-btn');

      // Disable all buttons to prevent changing answer
      optionButtons.forEach(btn => btn.disabled = true);

      // Check correctness
      if (selectedOpt.isCorrect) {
        correctAnswersCount++;
        optionButtons[selectedIndex].classList.add('selected-correct');
        showRationale(true, selectedOpt.rationale);
      } else {
        incorrectAnswersCount++;
        optionButtons[selectedIndex].classList.add('selected-incorrect');
        
        // Highlight correct answer
        q.options.forEach((opt, idx) => {
          if (opt.isCorrect) {
            optionButtons[idx].classList.add('show-correct');
          }
        });

        showRationale(false, selectedOpt.rationale);
      }

      // Show Next button
      const btnNext = document.getElementById('btn-next');
      if (currentQuestionIndex === questionsData.length - 1) {
        btnNext.innerText = "Ver Resultado Final";
      } else {
        btnNext.innerHTML = "Seguinte &rarr;";
      }
      btnNext.style.display = 'inline-block';

      // Typeset MathJax for rationale
      if (window.MathJax) {
        MathJax.typesetPromise();
      }
    }

    function showRationale(isCorrect, text) {
      const rationaleBox = document.getElementById('rationale-box');
      rationaleBox.style.display = 'block';
      rationaleBox.className = `rationale-box ${isCorrect ? 'correct' : 'incorrect'}`;
      rationaleBox.innerHTML = `<strong>${isCorrect ? 'Certo!' : 'Incorreto.'}</strong> ${text}`;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-header').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'none';
      
      document.getElementById('correct-count').innerText = correctAnswersCount;
      document.getElementById('incorrect-count').innerText = incorrectAnswersCount;
      
      const total = questionsData.length;
      const percentage = Math.round((correctAnswersCount / total) * 100);
      let message = "";

      if (percentage === 100) {
        message = "Excelente! Dominas perfeitamente todas as regras de potências para o 8.º ano! 🎉";
      } else if (percentage >= 70) {
        message = "Muito bom trabalho! Estás bem preparado, revês apenas os pequenos deslizes. 👍";
      } else if (percentage >= 50) {
        message = "Bom esforço! Recomendamos rever as regras onde surgiram dúvidas antes de avançar. 📚";
      } else {
        message = "Precisa de mais revisão. Volta a estudar as regras base e tenta novamente! 💪";
      }

      document.getElementById('final-message').innerText = message;
      document.getElementById('results-screen').style.display = 'block';
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      correctAnswersCount = 0;
      incorrectAnswersCount = 0;
      answeredQuestions.fill(false);

      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('quiz-header').style.display = 'block';
      document.getElementById('quiz-screen').style.display = 'block';

      loadQuestion();
    }

    // Initialize Quiz
    window.onload = () => {
      loadQuestion();
    };
  </script>
</body>
</html>
